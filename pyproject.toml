[project]
name = "all-things-agentic-hackathon"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "cloud-sql-python-connector>=1.21.0",
    "fastapi>=0.141.1",
    "firebase-admin>=7.5.0",
    "google-adk>=2.7.0",
    "google-cloud-storage>=3.13.1",
    "google-cloud-tasks>=2.24.0",
    "google-genai>=2.18.1",
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pgvector>=0.5.0",
    "psycopg>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "python-multipart>=0.0.32",
    "ruff>=0.16.3",
    "sqlalchemy>=2.0.52",
    "tenacity>=9.1.4",
    "uvicorn>=0.52.3",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
